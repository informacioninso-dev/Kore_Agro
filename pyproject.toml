[project]
name = "kore-agro"
version = "0.1.0"
description = "KORE AGRO ERP agricola multi-tenant, offline-first y orientado a P&L real."
authors = [{ name = "Binnso", email = "dev@binnso.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django==6.1",
  "django-tenants==3.14.0",
  "psycopg[binary]>=3.2.1,<3.3",
  "django-environ>=0.11,<1.0",
  "django-ninja>=1.4,<2.0",
  "celery>=5.5,<6.0",
  "redis>=5.2,<7.0",
  "whitenoise>=6.8,<8.0",
  "gunicorn>=23.0,<24.0",
  "uvicorn[standard]>=0.34,<1.0",
  "python-dateutil>=2.9,<3.0"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-django = ">=4.10,<5.0"
ruff = ">=0.12,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
norecursedirs = [".venv", ".pytest_cache", ".ruff_cache", "pytest-cache-files-*"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]
