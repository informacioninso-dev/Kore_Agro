x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    env_file: ${KORE_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  migrate:
    build: .
    env_file: ${KORE_ENV_FILE:-.env.production}
    command: sh -c "python manage.py migrate_schemas --noinput && python manage.py collectstatic --noinput"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  web:
    build: .
    env_file: ${KORE_ENV_FILE:-.env.production}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os; from urllib.request import Request, urlopen;
          request = Request('http://127.0.0.1:8000/readiness/',
          headers={'Host': os.environ['HEALTHCHECK_HOST'],
          'X-Forwarded-Proto': 'https'}); urlopen(request, timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped

  worker:
    build: .
    env_file: ${KORE_ENV_FILE:-.env.production}
    command: celery -A config.celery worker -l INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
