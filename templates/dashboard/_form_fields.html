{% if form.non_field_errors %}
  <div class="rounded border border-red-800 bg-red-950 px-3 py-2 text-sm text-red-100">
    {{ form.non_field_errors }}
  </div>
{% endif %}

{% for field in form.hidden_fields %}{{ field }}{% endfor %}

{% for field in form.visible_fields %}
  <label class="{% if field.field.widget.input_type == 'checkbox' %}flex items-center gap-2 text-sm text-neutral-300{% else %}grid gap-1 text-xs uppercase text-neutral-500{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
      {{ field }} <span>{{ field.label }}</span>
    {% else %}
      <span>{{ field.label }}</span>
      {{ field }}
    {% endif %}
    {% if field.errors %}
      <span class="text-xs normal-case text-red-300">{{ field.errors|striptags }}</span>
    {% endif %}
  </label>
{% endfor %}
